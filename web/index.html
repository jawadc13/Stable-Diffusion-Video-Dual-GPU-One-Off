<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>DualGPU Video Studio</title>
<link rel="stylesheet" href="/web/style.css">
</head>
<body>
<div id="canvas">
  <svg id="wires"></svg>
  <div id="graph"></div>
</div>
<div id="menu" class="hidden"><input id="menu-search" placeholder="Search nodes..."><div id="menu-list"></div></div>
<aside id="panel">
  <h2>DualGPU Video Studio</h2>
  <button id="queue" class="primary">Queue Prompt</button>
  <div class="row"><button id="save">Save</button><button id="load">Load</button><button id="default">Default</button><button id="clear">Clear</button></div>
  <input type="file" id="loadfile" accept=".json" hidden>
  <h3>GPUs</h3>
  <div id="gpus"></div>
  <h3>Status</h3>
  <div id="status">idle</div>
  <div id="log"></div>
  <p class="hint">Double-click / right-click canvas: add node · Drag background: pan · Wheel: zoom · Drag output dot → input dot to connect · Click input dot to disconnect · Del: delete selected</p>
</aside>
<script src="/web/editor.js"></script>
</body>
</html>
